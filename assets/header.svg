<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#021B1A"/>
      <stop offset="50%"  stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="12"/>

  <!-- Decorative map-line accents -->
  <path d="M0,160 Q150,140 300,160 T600,160 T900,160" fill="none" stroke="#A7F3D0" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <circle cx="150" cy="150" r="4" fill="#A7F3D0" fill-opacity="0.6"/>
  <circle cx="450" cy="160" r="4" fill="#A7F3D0" fill-opacity="0.8"/>
  <circle cx="750" cy="150" r="4" fill="#A7F3D0" fill-opacity="0.6"/>

  <!-- Main title -->
  <text
    x="450" y="95"
    font-family="'Segoe UI', 'Arial Black', sans-serif"
    font-size="64"
    font-weight="900"
    letter-spacing="4"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >ATM Route Optimizer</text>

  <!-- Subtitle -->
  <text
    x="450" y="138"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="18"
    font-weight="400"
    letter-spacing="2"
    text-anchor="middle"
    fill="#A7F3D0"
    fill-opacity="0.9"
  >High-Performance Cash Logistics &amp; Fleet Dispatch</text>

  <!-- Bottom tagline -->
  <text
    x="450" y="178"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="11.5"
    font-style="italic"
    letter-spacing="1"
    text-anchor="middle"
    fill="#ffffff"
    fill-opacity="0.45"
  >Powered by C++ Priority Queues &amp; DP Knapsack Algorithms.</text>
</svg>
